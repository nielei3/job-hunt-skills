# Geo filter: drop jobs whose location is non-US before LLM scoring / resolve.
# US is detected by an explicit US token (united states / usa / us as a whole word).
# Non-US is detected by substring match against `non_us_keywords`. Multi-region
# postings that mention US (e.g. "US, Canada, UK") pass — the US keyword wins.
# unknown_policy controls jobs whose location is empty or matches no keyword:
#   pass   → let through to triage (conservative; may include some non-US)
#   filter → drop them (aggressive; loses jobs whose parser failed)
location_filter:
  enabled: true
  unknown_policy: pass
  non_us_keywords:
    - canada
    - india
    - china
    - poland
    - spain
    - brazil
    - mexico
    - united kingdom
    - " uk"
    - "uk-"
    - "-uk"
