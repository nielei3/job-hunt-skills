# Seniority-level calibration used by resolve_external_jd.py to hard-filter
# jobs whose level is outside the target band before any LLM calls.
# See also: scripts/resolve_external_jd.py::determine_tier, is_in_band.
level_calibration:
  # User's target seniority band (inclusive, by tier name).
  target_band:
    min_tier: staff
    max_tier: senior_staff

  # Ordinal ranking of tiers. Used purely for comparison with target_band.
  tier_order:
    junior: 1
    mid: 2
    senior: 3
    staff: 4
    senior_staff: 5
    principal: 6
    distinguished: 7

  # Per-company title → tier mappings.
  # Rules are evaluated top-to-bottom, FIRST MATCH WINS — put longer/more
  # specific patterns before shorter ones ("senior principal" before "principal").
  # Pattern is case-insensitive substring match against the job title.
  companies:
    Snap:
      rules:
        - { pattern: "senior principal", tier: distinguished }
        - { pattern: "principal",         tier: principal      }   # Snap Principal ≈ L7, above target
        - { pattern: "senior staff",      tier: senior_staff   }
        - { pattern: "staff",             tier: staff          }   # Snap Staff ≈ L6, in band
        - { pattern: "senior",            tier: senior         }
    "Snap Inc.":
      rules:
        - { pattern: "senior principal", tier: distinguished }
        - { pattern: "principal",         tier: principal      }
        - { pattern: "staff",             tier: staff          }
        - { pattern: "senior",            tier: senior         }
    Salesforce:
      # User calibration: Salesforce Principal titles match the user's level
      # → map plain "Principal" to senior_staff (in band). The more specific
      # "principal architect" / "principal mts" already mapped here.
      rules:
        - { pattern: "principal architect", tier: senior_staff }
        - { pattern: "principal mts",       tier: senior_staff }
        - { pattern: "principal",           tier: senior_staff }   # Salesforce Principal ≈ in band per user
        - { pattern: "lead mts",            tier: staff        }
        - { pattern: "lead software engineer", tier: senior    }   # Lead SWE (not MTS ladder) ≈ L4–L5, below target
        - { pattern: "lead",                tier: senior       }
        - { pattern: "senior mts",          tier: senior       }
        - { pattern: "staff",               tier: staff        }
    Airbnb:
      rules:
        - { pattern: "principal",      tier: principal     }   # Airbnb Principal ≈ L7, above target
        - { pattern: "senior staff",   tier: senior_staff  }
        - { pattern: "staff",          tier: staff         }
        - { pattern: "senior",         tier: senior        }
    Netflix:
      # Netflix uses numbered IC engineering levels in three observed title
      # formats:
      #   1. "Software Engineer 5 - X"             (bare number)
      #   2. "Software Engineer L5 - X"            (L-prefixed)
      #   3. "Senior Software Engineer (L5) - X"   (parenthesized, with "Senior")
      # User calibration: Netflix's Senior tier (L4-L5) matches → both in-band.
      # An untagged "Senior X Engineer" with no level marker is also treated as
      # in-band (staff tier) — Netflix doesn't otherwise distinguish, and the
      # title_filter step already dropped non-engineering Senior roles.
      rules:
        - { pattern: "engineer 7",  tier: distinguished }
        - { pattern: "engineer l7", tier: distinguished }
        - { pattern: "(l7)",        tier: distinguished }
        - { pattern: "engineer 6",  tier: principal     }    # Netflix L6 ≈ above band
        - { pattern: "engineer l6", tier: principal     }
        - { pattern: "(l6)",        tier: principal     }
        - { pattern: "engineer 5",  tier: senior_staff  }    # in band (Netflix Senior top)
        - { pattern: "engineer l5", tier: senior_staff  }
        - { pattern: "(l5)",        tier: senior_staff  }
        - { pattern: "engineer 4",  tier: staff         }    # in band (Netflix Senior bottom)
        - { pattern: "engineer l4", tier: staff         }
        - { pattern: "(l4)",        tier: staff         }
        - { pattern: "engineer 3",  tier: senior        }    # below band
        # Catch-all for level-less Netflix engineering titles per user calibration.
        - { pattern: "senior",      tier: staff         }
        - { pattern: "lead",        tier: staff         }   # "Technical Lead" at Netflix
    TikTok:
      rules:
        - { pattern: "engineering tech lead", tier: staff    }
        - { pattern: "tech lead",             tier: staff    }
        - { pattern: "staff",                 tier: staff    }
        - { pattern: "senior",                tier: senior   }
    "TikTok USDS Joint Venture":
      rules:
        - { pattern: "tech lead", tier: staff  }
        - { pattern: "staff",     tier: staff  }
        - { pattern: "senior",    tier: senior }
    # Enterprise / non-big-tech — Principal title typically deflated to Staff-equivalent
    F5:
      rules:
        - { pattern: "sr. principal", tier: senior_staff }
        - { pattern: "senior principal", tier: senior_staff }
        - { pattern: "principal",      tier: staff        }   # F5 Principal ≈ L5–L6
        - { pattern: "staff",          tier: staff        }
    Siemens:
      rules:
        - { pattern: "sr. principal",    tier: senior_staff }
        - { pattern: "senior principal", tier: senior_staff }
        - { pattern: "principal",        tier: staff        }
        - { pattern: "staff",            tier: staff        }
    JPMorganChase:
      rules:
        - { pattern: "senior principal", tier: senior_staff }
        - { pattern: "principal",        tier: staff        }
        - { pattern: "executive director", tier: staff      }
    Walmart:
      # User calibration: Walmart Principal titles match the user's level
      # → senior_staff (in band) instead of principal (above band).
      rules:
        - { pattern: "principal",     tier: senior_staff }   # Walmart Principal ≈ in band per user
        - { pattern: "senior staff",  tier: senior_staff }
        - { pattern: "staff",         tier: staff        }
        - { pattern: "senior",        tier: senior       }
    Carta:
      rules:
        - { pattern: "principal",    tier: senior_staff }
        - { pattern: "staff",        tier: staff        }
        - { pattern: "senior",       tier: senior       }
    GitHub:
      rules:
        - { pattern: "senior principal", tier: principal    }
        - { pattern: "principal",        tier: senior_staff }
        - { pattern: "senior staff",     tier: senior_staff }
        - { pattern: "staff",            tier: staff        }
        - { pattern: "senior",           tier: senior       }
    Google:
      rules:
        - { pattern: "distinguished",    tier: distinguished }
        - { pattern: "senior principal", tier: principal    }
        - { pattern: "principal",        tier: principal    }
        - { pattern: "senior staff",     tier: senior_staff }
        - { pattern: "staff",            tier: staff        }
        - { pattern: "senior",           tier: senior       }
    Meta:
      rules:
        - { pattern: "distinguished",    tier: distinguished }
        - { pattern: "senior principal", tier: principal    }
        - { pattern: "principal",        tier: principal    }
        - { pattern: "senior staff",     tier: senior_staff }
        - { pattern: "staff",            tier: staff        }
        - { pattern: "senior",           tier: senior       }
    Amazon:
      rules:
        - { pattern: "distinguished",     tier: distinguished }
        - { pattern: "senior principal",  tier: principal    }
        - { pattern: "principal",         tier: senior_staff }   # Amazon Principal (L7) ≈ Meta E7
        - { pattern: "senior sde",        tier: senior       }
        - { pattern: "senior",            tier: senior       }
        - { pattern: "sde ii",            tier: mid          }   # Amazon SDE II (L5) — below target
        - { pattern: "software engineer ii", tier: mid       }   # Same level, alternate title format
        - { pattern: "sde i",             tier: junior       }   # Amazon SDE I (L4) — well below target
        - { pattern: "software engineer i", tier: junior     }   # Same level, alternate title format
    Microsoft:
      rules:
        - { pattern: "partner",           tier: principal    }
        - { pattern: "senior principal",  tier: principal    }
        - { pattern: "principal",         tier: senior_staff }
        - { pattern: "senior",            tier: senior       }

  # Applied when the job's company is not listed above.
  # Conservative — treats "Principal" as above target by default, since at most
  # big-tech companies it is. Companies with deflated Principal titles should
  # be added explicitly to the `companies` section above.
  default_rules:
    - { pattern: "distinguished",    tier: distinguished }
    - { pattern: "sr. principal",    tier: senior_staff  }
    - { pattern: "senior principal", tier: senior_staff  }
    - { pattern: "principal",        tier: principal     }
    - { pattern: "senior staff",     tier: senior_staff  }
    - { pattern: "engineering tech lead", tier: staff    }
    - { pattern: "tech lead",        tier: staff         }
    - { pattern: "staff",            tier: staff         }
    - { pattern: "lead",             tier: senior        }
    - { pattern: "senior",           tier: senior        }

  # Jobs whose tier cannot be determined (no rule matched) get this status.
  # Set to "in_band" to let them pass, or "out_of_band_unknown" to skip.
  unknown_policy: in_band

