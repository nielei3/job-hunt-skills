resume:
  source: vault_relative
  path: Career/resume/resume.md

target_companies:
  - name: Netflix
    ats: phenom
    phenom_host: explore.jobs.netflix.net
    phenom_domain: netflix.com
  - name: Airbnb
    ats: greenhouse
    board_slug: airbnb
  - name: Reddit
    ats: greenhouse
    board_slug: reddit
  - name: Affirm
    ats: greenhouse
    board_slug: affirm
  - name: Anthropic
    ats: greenhouse
    board_slug: anthropic
  # Microsoft + Microsoft AI both come from the same PCSX domain; Microsoft AI
  # uses team_filter to keep just AI-org roles. The seen_keys dedup will collapse
  # any overlap (same JD URL → same job_key), so duplicate scanning is harmless.
  - name: Microsoft
    ats: pcsx
    domain: microsoft.com
  - name: Microsoft AI
    ats: pcsx
    domain: microsoft.com
    team_filter: ai
  - name: Apple
    ats: apple_jobs
  - name: Amazon
    ats: amazon_jobs
    amazon_categories:
      - software-development
  # Google + Meta adapters are best-effort — careers.google.com and metacareers.com
  # don't expose stable public APIs. The scanner parses SSR HTML; if their layout
  # changes the listing may return zero results (logged, run continues).
  # Verify with: python3 scripts/scan_target_companies.py -c google
  - name: Google
    ats: google_careers
  - name: Meta
    ats: meta_careers
  # ── Greenhouse big-tech / unicorns ───────────────────────────────────────
  - name: Stripe
    ats: greenhouse
    board_slug: stripe
  - name: Snap
    ats: greenhouse
    board_slug: snap
    enabled: false  # Snap is not on Greenhouse; Workday tenant returns 422.
                    # Likely on Phenom or custom — TODO: find their public board.
  - name: Dropbox
    ats: greenhouse
    board_slug: dropbox
  - name: Pinterest
    ats: greenhouse
    board_slug: pinterest
  - name: Lyft
    ats: greenhouse
    board_slug: lyft
  - name: DoorDash
    ats: greenhouse
    board_slug: doordashusa  # verified: 449 jobs at this slug; "doordash" is 404
  - name: Coinbase
    ats: greenhouse
    board_slug: coinbase
  - name: Robinhood
    ats: greenhouse
    board_slug: robinhood
  - name: Block
    ats: greenhouse
    board_slug: block
  - name: Databricks
    ats: greenhouse
    board_slug: databricks
  - name: MongoDB
    ats: greenhouse
    board_slug: mongodb
  - name: Datadog
    ats: greenhouse
    board_slug: datadog
  - name: Cloudflare
    ats: greenhouse
    board_slug: cloudflare
  - name: Twilio
    ats: greenhouse
    board_slug: twilio
  - name: HashiCorp
    ats: greenhouse
    board_slug: hashicorp
    enabled: false  # No public board after IBM acquisition; Workday returns 401.
  # ── Greenhouse AI labs / scaleups ────────────────────────────────────────
  - name: xAI
    ats: greenhouse
    board_slug: xai
  - name: Scale AI
    ats: greenhouse
    board_slug: scaleai
  - name: Together AI
    ats: greenhouse
    board_slug: togetherai
  - name: Fireworks AI
    ats: greenhouse
    board_slug: fireworksai
  - name: Glean
    ats: greenhouse
    board_slug: gleanwork
  # ── Ashby AI labs ────────────────────────────────────────────────────────

  - name: Perplexity
    ats: ashby
    board_slug: perplexity
  - name: Decagon
    ats: ashby
    board_slug: decagon
  - name: Character.AI
    ats: ashby
    board_slug: character
  - name: OpenRouter
    ats: ashby
    board_slug: openrouter
  # ── Cursor (custom careers HTML) ─────────────────────────────────────────
  - name: Cursor
    ats: cursor_careers
  # ── TikTok (lifeattiktok.com + USDS) ────────────────────────────────────
  # Main portal migrated from careers.tiktok.com to lifeattiktok.com (2025).
  # Uses POST API with `website-path: tiktok` header. JD inline.
  # USDS portal requires Playwright (browser _signature).
  - name: TikTok
    ats: tiktok_careers
    # Server-side filters (same IDs as USDS portal).
    tiktok_job_category_id_list:
      - "6704215862603155720"   # R&D
    tiktok_location_code_list:
      - "CT_157"               # example location code — replace with yours
    tiktok_recruitment_id_list:
      - "1"                    # Experienced
    # Per-company title override: only tech lead roles (skip SWE/backend)
    title_include:
      - tech lead
      - engineering lead
      - architect
    title_exclude:
      - sre
      - site reliability
      - machine learning
      - quality assurance
  - name: TikTok USDS
    ats: tiktok_usds
    # Server-side filters (from careers.tiktokusds.com filter sidebar).
    # These drastically reduce noise: 303 → ~50 jobs.
    usds_job_category_id_list:
      - "6704215862603155720"   # R&D
    usds_location_code_list:
      - "CT_157"               # example location code — replace with yours
    usds_recruitment_id_list:
      - "1"                    # Experienced
    # Per-company title override: only tech lead roles (skip SWE/SRE)
    title_include:
      - tech lead
      - engineering lead
      - architect
    title_exclude:
      - sre
      - site reliability
      - machine learning
      - quality assurance
  # ── Workday tenants ─────────────────────────────────────────────────────
  # Each tenant has a different pod (wd1/wd5/wd12...) and site path. If a
  # listing fails, verify the URL by visiting {tenant}.{pod}.myworkdayjobs.com
  # in a browser and reading the path. Mark UNTESTED until first successful run.
  - name: Salesforce
    ats: workday
    workday_tenant: salesforce
    workday_pod: wd12
    workday_site: External_Career_Site
  - name: Nvidia
    ats: workday
    workday_tenant: nvidia
    workday_pod: wd5
    workday_site: NVIDIAExternalCareerSite
  - name: Adobe
    ats: workday
    workday_tenant: adobe
    workday_pod: wd5
    workday_site: external_experienced
  - name: Cisco
    ats: workday
    workday_tenant: cisco
    workday_pod: wd5
    workday_site: Cisco_Careers  # verified: 937 jobs (was at_cisco — 404)
  - name: Tesla
    ats: workday
    workday_tenant: tesla
    workday_pod: wd1
    workday_site: Tesla
    enabled: false  # Workday endpoint returns 422 on every site path; tenant
                    # likely requires CSRF/session token. TODO: investigate.
  - name: Walmart
    ats: workday
    workday_tenant: walmart
    workday_pod: wd5
    workday_site: WalmartExternal
    title_include:
      - principal
      - distinguished
  # ── TikTok / ByteDance ──────────────────────────────────────────────────
  # Disabled: careers.tiktok.com /api/v1/search/job/posts returns 200 with empty
  # body for both GET and POST — bot-detection. Would need headless browser or
  # email-alerts approach. Kept entry so the adapter is exercised by tests.
  - name: TikTok
    ats: tiktok_careers
    tiktok_portal_type: 6
    enabled: false
  # ── 小红书 / Xiaohongshu ────────────────────────────────────────────────
  # Disabled: probed Greenhouse / Lever / Ashby slugs (xiaohongshu / rednote /
  # xhs / redusa / xhsusa) — all 404. They likely use LinkedIn / their own
  # careers site only. Recommended path: set up an email alert on Indeed or
  # LinkedIn for "Xiaohongshu" / "RedNote" and parse those instead.
  - name: Xiaohongshu
    ats: lever
    board_slug: xiaohongshu
    enabled: false
  # ── Cross-company aggregators ────────────────────────────────────────────
  # Each entry produces jobs from many companies. The "name" field is just a
